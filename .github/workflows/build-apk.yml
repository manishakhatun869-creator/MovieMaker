name: Build Towfik Serial Platform APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android app
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'WARNING: Temporary signing key; configure the four APK_* secrets for update-compatible future builds.'
            KEYSTORE_PASSWORD=temporary-build-only
            KEY_PASSWORD=temporary-build-only
            KEY_ALIAS=temporary
            keytool -genkeypair -keystore /tmp/signing.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Towfik Serial Platform' -noprompt
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/signing.jks
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$build_tools/apksigner" sign --ks /tmp/signing.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Towfik-Serial-Platform.apk /tmp/aligned.apk
          "$build_tools/apksigner" verify --verbose Towfik-Serial-Platform.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Towfik-Serial-Platform-APK
          path: Towfik-Serial-Platform.apk
          if-no-files-found: error
