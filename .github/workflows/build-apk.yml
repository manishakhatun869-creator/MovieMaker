name: Build branded APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'branding/**'
      - 'scripts/brand.py'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install APK tooling
        run: |
          curl -fL --retry 4 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Decode, brand, and rebuild
        run: |
          set -euo pipefail
          input=$(find . -maxdepth 1 -name '*_antisplit.zip' -print -quit)
          test -n "$input"
          java -jar /tmp/apktool.jar d -f -o /tmp/decoded "$input"
          python3 scripts/brand.py /tmp/decoded
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/unsigned.apk
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'WARNING: No signing secrets configured; generating a temporary key. This APK cannot update another build or the original APK.'
            KEYSTORE_PASSWORD=temporary-build-only
            KEY_PASSWORD=temporary-build-only
            KEY_ALIAS=temporary
            keytool -genkeypair -keystore /tmp/signing.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Towfik Serial Platform' -noprompt
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/signing.jks
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/zipalign" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$build_tools/apksigner" sign --ks /tmp/signing.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Towfik-Serial-Platform.apk /tmp/aligned.apk
          "$build_tools/apksigner" verify --verbose Towfik-Serial-Platform.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Towfik-Serial-Platform-APK
          path: Towfik-Serial-Platform.apk
          if-no-files-found: error
